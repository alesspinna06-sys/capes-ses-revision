# Publie une nouvelle version : à chaque étiquette « vX.Y.Z », GitHub fabrique l'installateur Windows
# et le dépose dans « Releases ». Le logiciel installé le trouve tout seul (electron-updater).
name: Publier une version
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vite build
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
